<section class="comments">
  <h4>Comments</h4>
  @if (loading()) {
    <p>Loading comments...</p>
  } @else if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  } @else {
    @for (comment of comments(); track comment._id) {
      <p class="comment">{{ comment.text }}</p>
    } @empty {
      <p>No comments yet.</p>
    }
  }

  
</section>

<section class="add-comment">
  <label>
    Leave a comment
    <textarea #commentText maxlength="5000" [disabled]="posting()"></textarea>
  </label>

  <button type="button" (click)="postComment(commentText)" [disabled]="posting()">
    {{ posting() ? 'Posting...' : 'Post comment' }}
  </button>

  @if (postError()) {
    <p role="alert">{{ postError() }}</p>
  }
</section>
