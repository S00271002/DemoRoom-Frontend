<main>
  <a [routerLink]="['/']">Back to demos</a>

  @if (loading()) {
    <p>Loading demos...</p>
  } @else if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  } @else if (demo(); as selectedDemo) {
    <h1>{{ selectedDemo.title }}</h1>

    <app-demo-versions [demoId]="selectedDemo._id">
      <form [formGroup]="editForm" (ngSubmit)="saveDemo()">
        <h2>Demo details</h2>
        <label for="demo-title">Title</label>
        <input id="demo-title" type="text" formControlName="title" />
        <label for="demo-description">Description</label>
        <textarea id="demo-description" formControlName="description"></textarea>
        <button type="submit" [disabled]="saving()">Save changes</button>
        <button type="button" (click)="deleteDemo()" [disabled]="saving()">Delete demo</button>
        <p role="status">{{ saveMessage() }}</p>
      </form>
    </app-demo-versions>
  } @else {
    <p>Demo not found.</p>
  }
</main>
