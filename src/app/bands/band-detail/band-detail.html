<main>
  <h2>Bands</h2>

  <a [routerLink]="['/']">Back to bands</a>

  @if (loading())  {
    <p>Loading bands...</p>
  }
  @else if (errorMessage()) {
    <p>{{errorMessage()}}</p>
  }

  <p>Band ID: {{band()?._id}}</p>
    @if (band(); as selectedBand) {
        <p>Band Name: {{selectedBand.name}}</p>
        <p>Owner ID: {{selectedBand.ownerId}}</p>
        <p>Member IDs: {{selectedBand.memberIds.join(', ')}}</p>
    }
</main>
